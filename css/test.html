<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlapping Circles</title>
    <style>
        .container {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: absolute;
            border: 5px solid white; /* To create a gap between the circles */
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1); /* Optional: adds a shadow for depth */
        }

        .circle1 {
            background-color: #4A154B; /* Slack color */
            left: 0;
            top: 10px;
            z-index: 1;
        }

        .circle2 {
            background-color: #9146FF; /* Twitch color */
            right: 0;
            top: 10px;
            z-index: 2;
        }

        .circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle circle1">
            <img src="slack_logo.png" alt="Slack Logo"> <!-- Add your image source here -->
        </div>
        <div class="circle circle2">
            <img src="twitch_logo.png" alt="Twitch Logo"> <!-- Add your image source here -->
        </div>
    </div>
</body>
</html>
