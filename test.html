<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Numbers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <p class="number-style">3589</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
<style>
    .number-style {
    display: flex;
    gap: 16px;
}

.number-style span {
    display: inline-block;
    width: 76px;
    height: 76px;
    border: 1px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
}

</style>

<script type="text/javascript">
    document.querySelectorAll('.number-style').forEach(paragraph => {
    paragraph.innerHTML = paragraph.textContent.split('').map(num => `<span>${num}</span>`).join('');
});

</script>
