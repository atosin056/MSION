<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Background Hover Effect</title>
    <style>
        .hover-effect {
            position: relative;
            overflow: hidden;
            display: inline-block;
            padding: 10px 20px;
            background-color: #f0f0f0;
            color: black;
            transition: color 0.4s ease;
        }

        .hover-effect::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #333;
            transition: left 0.4s ease;
        }

        .hover-effect:hover::before {
            left: 0;
        }

        .hover-effect:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="hover-effect">Hover over me!</div>
</body>
</html>
